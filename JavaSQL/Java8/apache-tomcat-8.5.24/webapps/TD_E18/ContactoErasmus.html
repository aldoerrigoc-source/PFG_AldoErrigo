<HTML>
    <HEAD>
        <TITLE>ContactoErasmus</TITLE>
		<H1>Contacto Erasmus</H1>
    </HEAD>
		<BODY>
			<P>A continuacion escriba todos sus datos para mandar la solicitud de Erasmus</P>
		
				<form action="Erasmus" method="GET" name="form">

					Nombre: <input NAME="nombre" size="20">
					Apellido: <input NAME="apellido" size="20">
					Correo institucional: <input NAME="Correo" size="20">

					
					<P>Seleccione Pa&iacute;s de inter&eacute;s (Solo se puede elegir uno):</P>	
					<p><select NAME="Pais" size="3" MULTIPLE></P>
						<option VALUE="España"> Espa&ntilde;a </option>
						<option VALUE="Italia"> Italia  </option>
						<option VALUE="Alemania"> Alemania </option>
						<option VALUE="Francia"> Francia  </option>
						<option VALUE="Portugal"> Portugal </option>
						<option VALUE="Inglaterra"> Inglaterra  </option>
						<option VALUE="Estados Unidos"> Estados Unidos </option>
					</select>
					
					
					<P>Seleccione Semestre:</P>
						<input TYPE="radio" NAME="Semestre" VALUE="2do2023"> 2do Semestre 2023 <br>
						<input TYPE="radio" NAME="Semestre" VALUE="1er2024"> 1er Semestre 2024 <br>
						<input TYPE="radio" NAME="Semestre" VALUE="2do2024"> 2do Semestre 2024 <br>
						<input TYPE="radio" NAME="Semestre" VALUE="1er2025"> 1er Semestre 2025 <br>
						
				<P><input TYPE="SUBMIT" VALUE="Enviar Solicitud"> </P>
				</form>
		
	    </BODY>
</HTML>
