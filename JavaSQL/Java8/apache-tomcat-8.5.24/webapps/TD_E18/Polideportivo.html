<HTML>
    <HEAD>
        <TITLE>Reserva polideportivo</TITLE>
		<H1>Reserva Polideportivo</H1>
    </HEAD>
	
	
    <BODY>
	
	
	<form action="Polideportivo" method="GET">
		<P>Solo puede reservar el polideportivo una vez al d&iacute;a.</P>
		
		<PRE>
		Nombre: <input NAME="nombre" size="20">
		Apellido: <input NAME="apellido" size="20">
		Correo institucional: <input NAME="Correo" size="20">
		
		</PRE>
		
		Seleccione d&iacute;a :
		<input TYPE="date" name='Date'>
		<P>Seleccione horario:</P>
		
			<input TYPE="radio" NAME="Horario" VALUE="9:00-10:30">  9:00-10:30 <br>
			<input TYPE="radio" NAME="Horario" VALUE="10:30-12:00"> 10:30-12:00 <br>
			<input TYPE="radio" NAME="Horario" VALUE="12:00-13:30"> 12:00-13:30 <br>
			<input TYPE="radio" NAME="Horario" VALUE="13:30-15:00"> 13:30-15:00 <br>
			<input TYPE="radio" NAME="Horario" VALUE="15:00-16:30"> 15:00-16:30 <br>
			<input TYPE="radio" NAME="Horario" VALUE="16:30-18:00"> 16:30-18:00 <br>
			<input TYPE="radio" NAME="Horario" VALUE="18:00-19:30"> 18:00-19:30 <br>
	  
		
		
		
		<P><input TYPE="SUBMIT" VALUE="Enviar Solicitud"> </P>
		
	</form>
	
	
    </BODY>
</HTML>
